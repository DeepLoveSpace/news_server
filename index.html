<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новостная лента</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        #news { border: 1px solid #ccc; padding: 20px; min-height: 300px; border-radius: 8px; background: #fafafa; }
        .news-item { border-bottom: 1px solid #eee; padding: 10px 0; }
        .news-item:last-child { border-bottom: none; }
        #status { color: #666; margin-bottom: 10px; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>📰 Новостная лента (WebSocket)</h1>
    <div id="status">Подключение...</div>
    <div id="news"></div>

    <script>
        const newsDiv = document.getElementById('news');
        const statusDiv = document.getElementById('status');

        // Подключаемся к WebSocket на том же хосте, что и страница
        const ws = new WebSocket(`ws://${window.location.host}/ws`);

        ws.onopen = () => {
            statusDiv.textContent = '🟢 Подключено. Ожидание новостей...';
        };

        ws.onmessage = (event) => {
            const item = document.createElement('div');
            item.className = 'news-item';
            item.textContent = event.data;
            // Добавляем новые новости сверху
            newsDiv.prepend(item);
        };

        ws.onclose = () => {
            statusDiv.textContent = '🔴 Соединение закрыто. Обновите страницу для переподключения.';
        };

        ws.onerror = (err) => {
            console.error('Ошибка WebSocket:', err);
            statusDiv.textContent = '⚠️ Ошибка соединения.';
        };
    </script>
</body>
</html>
